# CI/CD for TARS.
#
#   pull request ─┬─ secret scan ─┐
#                 ├─ python tests ─┼─► build all images (no push)
#                 └─ frontend ─────┘
#   push to main / tag v* ── same checks ─► build + push images to GHCR
#                                            (tags: sha-<commit>, main, <version>)
#
# Deployment to AWS is not wired yet: it needs the Terraform/ECS work (plan Task 9),
# where a reviewed `terraform plan` consumes the image digests published here.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install locked dependencies
        run: uv pip install -r requirements.lock
      - name: Start test infrastructure (Postgres, Redis, S3-compatible)
        run: docker compose -p tars-test -f docker-compose.test.yml up -d --wait
      - name: Unit, contract and integration tests
        run: python -m pytest -q
      - name: Stop test infrastructure
        if: always()
        run: docker compose -p tars-test -f docker-compose.test.yml down -v

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

  images:
    name: Image ${{ matrix.image }}
    needs: [secrets, python, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR; unused on pull requests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ephemeris, context: ., file: services/Dockerfile, target: ephemeris }
          - { image: trajectory, context: ., file: services/Dockerfile, target: trajectory }
          - { image: jobs, context: ., file: services/Dockerfile, target: jobs }
          - { image: worker, context: ., file: services/Dockerfile, target: worker }
          - { image: frontend, context: frontend, file: frontend/Dockerfile, target: "" }
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          # Only the frontend uses these; they are inlined into its bundle at build time.
          # Set repository variables to point a published frontend at real API URLs.
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8002' }}
            PUBLIC_EPHEMERIS_URL=${{ vars.PUBLIC_EPHEMERIS_URL || 'http://localhost:8001' }}
            PUBLIC_JOBS_URL=${{ vars.PUBLIC_JOBS_URL || 'http://localhost:8003' }}
