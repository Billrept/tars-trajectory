# CI/CD for TARS.
#
#   pull request ─┬─ secret scan ───┐
#                 ├─ python tests ───┼─► build all images (no push)
#                 ├─ frontend ───────┤
#                 └─ deploy config ──┘   (terraform validate, helm lint/render, kubeconform)
#   push to main ── same ─► push images to GHCR ─► deploy staging   (if DEPLOY_ENABLED)
#   tag v*       ── same ─► push images to GHCR ─► deploy staging ─► deploy production
#                                                                   (approval required)
# Deploys run .github/workflows/deploy.yml against IBM Cloud (IKS or OpenShift).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install locked dependencies
        run: uv pip install -r requirements.lock
      - name: Start test infrastructure (Postgres, Redis, S3-compatible)
        run: docker compose -p tars-test -f docker-compose.test.yml up -d --wait
      - name: Unit, contract and integration tests
        run: python -m pytest -q
      - name: Stop test infrastructure
        if: always()
        run: docker compose -p tars-test -f docker-compose.test.yml down -v

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

  deploy-config:
    name: Deployment config (Terraform, Helm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Terraform fmt and validate (no backend, no credentials)
        run: |
          terraform fmt -check -recursive infra/terraform
          for root in infra/terraform/ibm/platform infra/terraform/ibm/cluster; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Helm lint and render every values combination
        run: |
          chart=deploy/helm/tars; mkdir -p rendered rendered-crd
          helm lint "$chart" -f "$chart/values-production.yaml"
          helm template tars "$chart" > rendered/default.yaml
          helm template tars "$chart" -f "$chart/values-staging.yaml" > rendered/staging.yaml
          helm template tars "$chart" -f "$chart/values-production.yaml" > rendered/production.yaml
          helm template tars "$chart" -f "$chart/values-production.yaml" -f "$chart/values-openshift.yaml" > rendered/openshift.yaml
          helm lint deploy/helm/tars-data
          helm template tars-data deploy/helm/tars-data > rendered-crd/data.yaml
      - name: Validate rendered manifests (kubeconform, strict)
        run: >
          docker run --rm -v "$PWD/rendered:/r"
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary -kubernetes-version 1.30.0 /r/default.yaml /r/staging.yaml /r/production.yaml /r/openshift.yaml
      - name: Validate the data chart (operator CRDs such as CloudNativePG Cluster are skipped)
        run: >
          docker run --rm -v "$PWD/rendered-crd:/r"
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /r/data.yaml

  images:
    name: Image ${{ matrix.image }}
    needs: [secrets, python, frontend, deploy-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR; unused on pull requests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ephemeris, context: ., file: services/Dockerfile, target: ephemeris }
          - { image: trajectory, context: ., file: services/Dockerfile, target: trajectory }
          - { image: jobs, context: ., file: services/Dockerfile, target: jobs }
          - { image: worker, context: ., file: services/Dockerfile, target: worker }
          - { image: frontend, context: frontend, file: frontend/Dockerfile, target: "" }
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          # Only the frontend uses these. same-origin = relative /api/v1 calls, so one image
          # works behind any ingress host (build once, deploy to every environment).
          build-args: |
            PUBLIC_API_URL=same-origin

  deploy-staging:
    name: Deploy staging
    needs: [images]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      values_file: values-staging.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy-production:
    name: Deploy production
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production # protect this environment with required reviewers
      values_file: values-production.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read
