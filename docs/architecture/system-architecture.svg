<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc" id="system-architecture-root">
<title id="system-architecture-title">TARS system architecture</title>
<desc id="system-architecture-desc">The frontend calls the ephemeris, trajectory and jobs services; jobs commit admission and outbox rows to PostgreSQL, the outbox feeds a Redis queue, a CPU worker writes fenced results to PostgreSQL and object storage, and a loader publishes JPL Horizons datasets to object storage.</desc>
