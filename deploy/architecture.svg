<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-topology-title deploy-topology-desc" id="deploy-topology-root">
<title id="deploy-topology-title">TARS deployment topology on OpenShift</title>
<desc id="deploy-topology-desc">Browser traffic reaches the OpenShift router, which routes paths to the frontend, ephemeris, trajectory and jobs services in namespace tars; jobs admit work into CloudNativePG Postgres and enqueue it on Redis, a worker computes it and writes fenced results to Postgres and a NooBaa bucket that also holds the ephemeris datasets.</desc>
