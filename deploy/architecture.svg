      #deploy-topology-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #deploy-topology-root p.note { font-size: 0.85rem; color: #4f5d75; max-width: 70ch; margin: 0.75rem 0 0; line-height: 1.5; }
      #deploy-topology-root .scroll { overflow-x: auto; }</style>
