apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels: {app.kubernetes.io/part-of: tars, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  storage:
    size: {{ .Values.postgres.storageSize }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname   # never two instances on one node
    podAntiAffinityType: required
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  postgresql:
    parameters:
      max_connections: "200"
