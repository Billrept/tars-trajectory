# Layer on top of staging/production values for OpenShift (Red Hat OpenShift on IBM Cloud, TechZone, OCP):
#   helm upgrade --install tars deploy/helm/tars -f values-staging.yaml -f values-openshift.yaml
platform: openshift            # no fixed UIDs: the restricted-v2 SCC assigns one
ingress:
  className: ""                # default router
  annotations:
    route.openshift.io/termination: edge          # HTTPS at the router (wildcard *.apps certificate)
    haproxy.router.openshift.io/timeout: 3600s    # long-lived ephemeris WebSocket
networkPolicy:
  ingressNamespaceSelectors:
    - policy-group.network.openshift.io/ingress: ""        # router pods on the pod network
    - policy-group.network.openshift.io/host-network: ""   # HostNetwork routers (bare metal, e.g. TechZone)
config:
  trustedProxyHops: "1"        # the router appends one X-Forwarded-For entry
