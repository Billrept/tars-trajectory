{{- /* One Deployment (+ Service, PDB, HPA) per entry in .Values.services. */ -}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $root "name" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "tars.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "tars.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: tars
        {{- include "tars.selector" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default 30 }}
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "tars.podSecurity" $root | nindent 8 }}
      {{- if $root.Values.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "tars.selector" $ctx | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "tars.image" (dict "root" $root "image" $svc.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- if eq $name "frontend" }}
          env:
            - {name: HOME, value: /tmp}   # read-only root filesystem
          {{- else }}
          env:
            {{- include "tars.env" $root | nindent 12 }}
          envFrom:
            {{- include "tars.envFrom" $root | nindent 12 }}
          {{- end }}
          {{- if $svc.port }}
          ports:
            - {name: http, containerPort: {{ $svc.port }}}
          {{- end }}
          {{- with $svc.health }}
          startupProbe:
            httpGet: {path: {{ .path }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ .path }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: {{ .livePath }}, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- include "tars.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            {{- if eq $name "frontend" }}
            - {name: tmp, mountPath: /tmp}
            {{- else }}
            {{- include "tars.volumeMounts" $root | nindent 12 }}
            {{- end }}
      volumes:
        {{- if eq $name "frontend" }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- else }}
        {{- include "tars.volumes" $root | nindent 8 }}
        {{- end }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "tars.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "tars.selector" $ctx | nindent 4 }}
  ports:
    - {name: http, port: {{ $svc.port }}, targetPort: http}
{{- end }}
{{- if or $svc.autoscaling.enabled (gt (int $svc.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "tars.labels" $root | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "tars.selector" $ctx | nindent 6 }}
{{- end }}
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "tars.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $root.Release.Name }}-{{ $name }}
  minReplicas: {{ $svc.autoscaling.min }}
  maxReplicas: {{ $svc.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $svc.autoscaling.cpu }}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # don't flap after a spike
{{- end }}
{{- end }}
