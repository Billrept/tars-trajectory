x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
x-environment: &environment
  APP_ENV: local
  DATABASE_URL: postgresql://tars:${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}@postgres:5432/tars
  QUEUE_REDIS_URL: redis://queue:6379/0
  CACHE_REDIS_URL: redis://cache:6379/0
  S3_ENDPOINT_URL: http://objects:8333
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run scripts/setup_local.py first}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run scripts/setup_local.py first}
  AWS_REGION: us-east-1
  DATASET_BUCKET: tars-datasets
  RESULT_BUCKET: tars-results
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Run scripts/setup_local.py first}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  EPHEMERIS_URL: http://ephemeris:8000
x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz',timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 15s
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
      POSTGRES_DB: tars
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars"]
      interval: 2s
      retries: 30
  queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["queue_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lfu"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  objects:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run scripts/setup_local.py first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run scripts/setup_local.py first}
    volumes: ["object_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 2s
      retries: 30
  initialize:
    image: tars/jobs:local  # built by the jobs service
    pull_policy: never
    environment: *environment
    user: "10001"
    command: ["python", "/bootstrap/initialize_services.py"]
    volumes: ["./scripts/initialize_services.py:/bootstrap/initialize_services.py:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      objects: {condition: service_healthy}
  loader:
    image: tars/ephemeris:local  # built by the ephemeris service
    pull_policy: never
    environment:
      <<: *environment
      EPHEMERIS_START: ${EPHEMERIS_START:-2025-01-01}
      EPHEMERIS_END: ${EPHEMERIS_END:-2060-01-01}
    command: ["python", "-m", "ephemeris_service.loader"]
    depends_on:
      initialize: {condition: service_completed_successfully}
      cache: {condition: service_healthy}
  ephemeris:
    <<: *app
    build: {context: ., dockerfile: services/Dockerfile, target: ephemeris}
    image: tars/ephemeris:local
    environment: *environment
    ports: ["127.0.0.1:8001:8000"]
    healthcheck: *health
    depends_on:
      loader: {condition: service_completed_successfully}
  trajectory:
    <<: *app
    build: {context: ., dockerfile: services/Dockerfile, target: trajectory}
    image: tars/trajectory:local
    environment: *environment
    ports: ["127.0.0.1:8002:8000"]
    healthcheck: *health
    depends_on:
      ephemeris: {condition: service_healthy}
  jobs:
    <<: *app
    build: {context: ., dockerfile: services/Dockerfile, target: jobs}
    image: tars/jobs:local
    environment:
      <<: *environment
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      GLOBAL_QUEUE_CAP: ${GLOBAL_QUEUE_CAP:-25}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-5}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-30}
    ports: ["127.0.0.1:8003:8000"]
    healthcheck: *health
    depends_on:
      initialize: {condition: service_completed_successfully}
      ephemeris: {condition: service_healthy}
  outbox:
    <<: *app
    image: tars/jobs:local  # built by the jobs service
    pull_policy: never
    environment: *environment
    command: ["python", "-m", "jobs_service.outbox"]
    depends_on:
      jobs: {condition: service_healthy}
      queue: {condition: service_healthy}
  worker:
    <<: *app
    build: {context: ., dockerfile: services/Dockerfile, target: worker}
    image: tars/worker:local
    environment: *environment
    depends_on:
      jobs: {condition: service_healthy}
      queue: {condition: service_healthy}
  frontend:
    <<: *app
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8002}
        PUBLIC_EPHEMERIS_URL: ${PUBLIC_EPHEMERIS_URL:-http://localhost:8001}
        PUBLIC_JOBS_URL: ${PUBLIC_JOBS_URL:-http://localhost:8003}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://localhost:3000/healthz')).ok) process.exit(1)"]
      interval: 5s
      retries: 30
    depends_on:
      trajectory: {condition: service_healthy}
      jobs: {condition: service_healthy}
volumes:
  postgres_data:
  queue_data:
  object_data:
